<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư thông báo mật!</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #87CEEB; 
            font-family: 'Space Mono', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000;
        }

        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            width: 90%;
            max-width: 500px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            display: none; 
            position: absolute;
            z-index: 10;
        }

        /* Lớp active kích hoạt hiển thị */
        .window.active {
            display: block;
            animation: popUp 0.3s ease-out forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        
        .title-bar.pink { background: #d81b60; } 

        .content {
            padding: 20px;
            font-size: 15px;
            text-align: center;
        }

        .sticky-note {
            background-color: #fff9c4; 
            border: 1px solid #e0e0e0;
            padding: 20px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            font-family: 'Mali', cursive;
            font-size: 16px;
            text-align: left;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .pinned-img {
            width: 100%;
            max-width: 300px;
            border: 6px solid #fff;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.3);
            margin: 15px auto 0;
            display: block;
            transform: rotate(-2deg);
        }

        button {
            font-family: 'Space Mono', monospace;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            font-size: 14px;
            transition: transform 0.1s;
        }

        button:active { 
            border-color: #000000 #ffffff #ffffff #000000;
            transform: scale(0.98);
        }
        .btn-cute { background: #ffb6c1; } 

        #btn-no {
            position: relative;
            transition: all 0.15s ease-out;
            z-index: 999; /* Đảm bảo nút từ chối không bị đè */
        }

        .sticker {
            max-width: 120px;
            margin: 10px auto;
            display: block;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-pulse {
            max-width: 90px;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }
        
        .shin-drive {
            max-width: 250px;
            animation: drive 2.5s linear infinite;
        }
        @keyframes drive {
            0% { transform: translateX(-30px) translateY(0); }
            50% { transform: translateX(0px) translateY(-5px); }
            100% { transform: translateX(30px) translateY(0); }
        }

        .loading-text {
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            color: #000080;
            margin-top: 10px;
        }

        .invitation-card {
            background: #fffdf0; 
            border: 2px dashed #d81b60;
            padding: 20px;
            font-family: 'Mali', cursive; 
            text-align: left;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        .invitation-card strong { color: #d81b60; }
    </style>
</head
